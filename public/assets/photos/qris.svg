<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="100%" height="100%">
  <defs>
    <style>
      .txt-qris { font-family: 'Courier New', monospace; font-weight: bold; }
    </style>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="460" rx="16" fill="#FFFFFF" stroke="#E8E0D5" stroke-width="3"/>

  <!-- QRIS Header Banner -->
  <path d="M0,0 L400,0 L400,70 L0,70 Z" fill="#E30613"/>
  <text x="200" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">QRIS</text>
  <text x="200" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="9" fill="#FFFFFF" opacity="0.9" text-anchor="middle" letter-spacing="1">STANDAR PEMBAYARAN NASIONAL</text>

  <!-- Merchant Name -->
  <text x="200" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#2E1E12" text-anchor="middle">KADO DIGITAL HAFLA &amp; FIFI</text>
  <text x="200" y="125" class="txt-qris" font-size="11" fill="#6E5D4F" text-anchor="middle">NMID: ID1029384756201</text>

  <!-- Simulated QR Code Grid -->
  <g transform="translate(75, 145)">
    <!-- QR Outer Frame -->
    <rect width="250" height="250" fill="#FFFFFF" stroke="#2E1E12" stroke-width="2"/>
    
    <!-- Top-Left Finder Pattern -->
    <rect x="10" y="10" width="55" height="55" fill="#2E1E12"/>
    <rect x="20" y="20" width="35" height="35" fill="#FFFFFF"/>
    <rect x="27" y="27" width="21" height="21" fill="#2E1E12"/>

    <!-- Top-Right Finder Pattern -->
    <rect x="185" y="10" width="55" height="55" fill="#2E1E12"/>
    <rect x="195" y="20" width="35" height="35" fill="#FFFFFF"/>
    <rect x="202" y="27" width="21" height="21" fill="#2E1E12"/>

    <!-- Bottom-Left Finder Pattern -->
    <rect x="10" y="185" width="55" height="55" fill="#2E1E12"/>
    <rect x="20" y="195" width="35" height="35" fill="#FFFFFF"/>
    <rect x="27" y="202" width="21" height="21" fill="#2E1E12"/>

    <!-- Center Heart Logo in QR -->
    <rect x="95" y="95" width="60" height="60" rx="8" fill="#E30613"/>
    <path d="M125,138 C115,128 108,122 108,113 C108,107 113,103 118,103 C122,103 124,105 125,107 C126,105 128,103 132,103 C137,103 142,107 142,113 C142,122 135,128 125,138 Z" fill="#FFFFFF"/>

    <!-- Decorative QR Data Blocks -->
    <rect x="75" y="20" width="10" height="40" fill="#2E1E12"/>
    <rect x="95" y="30" width="20" height="15" fill="#2E1E12"/>
    <rect x="125" y="15" width="15" height="25" fill="#2E1E12"/>
    <rect x="150" y="35" width="25" height="15" fill="#2E1E12"/>

    <rect x="20" y="75" width="40" height="10" fill="#2E1E12"/>
    <rect x="35" y="95" width="25" height="20" fill="#2E1E12"/>
    <rect x="15" y="125" width="30" height="15" fill="#2E1E12"/>
    <rect x="30" y="150" width="20" height="25" fill="#2E1E12"/>

    <rect x="190" y="75" width="20" height="15" fill="#2E1E12"/>
    <rect x="220" y="95" width="15" height="30" fill="#2E1E12"/>
    <rect x="180" y="135" width="25" height="20" fill="#2E1E12"/>
    <rect x="215" y="165" width="20" height="15" fill="#2E1E12"/>

    <rect x="75" y="190" width="30" height="20" fill="#2E1E12"/>
    <rect x="115" y="180" width="20" height="15" fill="#2E1E12"/>
    <rect x="90" y="220" width="25" height="15" fill="#2E1E12"/>
    <rect x="145" y="205" width="35" height="20" fill="#2E1E12"/>
    <rect x="190" y="210" width="45" height="25" fill="#2E1E12"/>
  </g>

  <!-- Footer Info -->
  <text x="200" y="425" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#6E5D4F" text-anchor="middle">BCA Mobile • GoPay • OVO • ShopeePay • Dana</text>
  <text x="200" y="442" class="txt-qris" font-size="9" fill="#A39181" text-anchor="middle">VERIFIED MERCHANT • ZERO TRANSACTION FEE</text>
</svg>
